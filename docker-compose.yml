name: novelreading
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: novel_db
      POSTGRES_USER: novel_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U novel_user -d novel_db]
      interval: 5s
      timeout: 5s
      retries: 5
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg2://novel_user:${POSTGRES_PASSWORD}@postgres:5432/novel_db
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY}
      CORS_ORIGINS: http://localhost:8080,http://localhost:5173,http://localhost:3000,http://127.0.0.1:8080
      DATA_SOURCE_MODE: ${DATA_SOURCE_MODE:-real}
      BOOK_CACHE_DIR: /data/books
      ADMIN_INIT_USERNAME: admin
      ADMIN_INIT_PASSWORD: ${ADMIN_INIT_PASSWORD:?Set ADMIN_INIT_PASSWORD}
      DEBUG: false
    volumes:
      - bookcache:/data/books
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - 8000:8000
    restart: unless-stopped
  web:
    build: ./frontend-web
    ports:
      - 8080:80
    depends_on:
      - backend
    restart: unless-stopped
volumes:
  bookcache:
  pgdata:
